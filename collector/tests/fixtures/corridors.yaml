# Test fixture: a frozen copy of the seeded placeholder panel. Tests never read
# config/corridors.yaml, which changes as real corridors are declared.
# Corridor declarations: the only place a corridor is defined.
#
# Rules (validated by collector/config.py, geometry immutability by
# collector/immutability.py in CI):
# - id is permanent. Once a corridor has been anything but a draft, its origin,
#   destination, via points and direction never change and it is never removed.
#   To change a measured road, retire it and declare a new id with supersedes.
# - class: core | alternate | donor. An alternate is declared, never derived:
#   it shares its pair's origin and destination and is pinned to its own road
#   by via points, sent to TomTom as route stops and never shown to users.
#   A pair holding one corridor is valid: no measured alternate. A donor is an
#   unpaired control corridor for intervention audits.
# - tier: A every 15 min, B and C every 30 min, 06:30-10:30 and 16:30-21:00
#   IST; every tier also every 30 min from 00:00 to 04:00 IST.
# - direction ab | ba. A pair's ba corridors reverse its ab endpoints.
# - status: draft (never collected) | active | paused | retired.
# - Place via points on the intended carriageway, in the direction of travel.
#
# The ten corridors below are PLACEHOLDERS, all status draft, so nothing here
# is collected. Replace them with the real panel before activating anything.

