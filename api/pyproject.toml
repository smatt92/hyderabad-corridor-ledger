[project]
name = "hyderabad-corridor-ledger-api"
version = "0.4.0"
description = "Read-only API for the Hyderabad corridor ledger"
requires-python = ">=3.12,<3.13"
# The request path serves precomputed rows. No numpy, no pandas, no computation.
dependencies = ["fastapi>=0.141.1,<0.142"]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1", "ruff>=0.16.7", "uvicorn>=0.52.4"]

[tool.uv]
package = false
# A plain `uv sync` (as a deploy build may run) installs runtime dependencies only.
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
