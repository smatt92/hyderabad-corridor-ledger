name: archive

on:
  schedule:
    - cron: '43 6 2 * *'  # 12:13 IST on the 2nd, between collection windows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    name: archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync --locked --group archive
      - name: Archive rows older than 90 days to Parquet, verify the read-back, then prune
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: uv run python archive.py run
