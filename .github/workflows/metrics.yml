name: metrics

on:
  schedule:
    - cron: '41 21 * * *'  # 03:11 IST, after the local day has closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  backfill:
    name: backfill
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync --locked --no-dev
      # Walk the chain first: a broken record fails the run before anything is
      # recomputed or published from it. The result is what /verify serves.
      - name: Walk the sample hash chain
        run: uv run python -m metrics verify
      # Every run recomputes all history from raw and republishes the open
      # dataset. Once the archive job exists, download the archive here and pass
      # --archive-dir; without it, backfill refuses to run as soon as the hot
      # table no longer starts at seq 1.
      - name: Recompute every derived table from raw and publish exports
        run: uv run python -m metrics backfill
