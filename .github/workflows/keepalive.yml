name: keepalive

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. Re-enabling them through the API resets that
# clock without a commit, so no bot identity ever writes to the history.
on:
  schedule:
    - cron: '29 7 * * 1'  # Mondays 12:59 IST
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    name: keepalive
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable every scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in collector.yml daily.yml archive.yml metrics.yml db-size.yml keepalive.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
            echo "enabled $workflow"
          done
