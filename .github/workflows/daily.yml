name: daily

on:
  schedule:
    - cron: '17 21 * * *'  # 02:47 IST: the previous IST day's last slot closed at 21:00
  workflow_dispatch:
    inputs:
      day:
        description: IST day to check for gaps, YYYY-MM-DD (default yesterday)
        required: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  chain:
    name: chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync --locked
      # Records both chains' head row_hash in chain_verifications and fails on
      # the first break. The job summary keeps a copy of each head outside the
      # database.
      - name: Walk both hash chains and record their heads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: uv run python chain.py

  gaps:
    name: gaps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync --locked
      - name: Compare scheduled slots with the ledger; fail on any missing slot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAY: ${{ inputs.day }}
        run: uv run python gaps.py ${DAY:+"$DAY"}
