name: daily

on:
  schedule:
    - cron: '17 21 * * *'  # 02:47 IST: the previous IST day's last slot closed at 21:00
  workflow_dispatch:
    inputs:
      day:
        description: IST day to check for gaps, YYYY-MM-DD (default yesterday)
        required: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  chain:
    name: chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync --locked
      # Records both chains' head row_hash in chain_verifications and fails on
      # the first break. The job summary keeps a copy of each head outside the
      # database.
      - name: Walk both hash chains and record their heads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: uv run python chain.py
      # A head hash kept only inside the database it describes proves nothing.
      # The heads are mailed to a separate mailbox with a send-only credential
      # that cannot read or delete mail; the mailbox's own password is never a
      # secret here. The step runs even when the walk found a break, and fails
      # loudly until the HEAD_HASH_* secrets are set.
      - name: Mail the chain heads to the witness mailbox
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HEAD_HASH_SMTP_HOST: ${{ secrets.HEAD_HASH_SMTP_HOST }}
          HEAD_HASH_SMTP_PORT: ${{ secrets.HEAD_HASH_SMTP_PORT }}
          HEAD_HASH_SMTP_USERNAME: ${{ secrets.HEAD_HASH_SMTP_USERNAME }}
          HEAD_HASH_SMTP_PASSWORD: ${{ secrets.HEAD_HASH_SMTP_PASSWORD }}
          HEAD_HASH_MAIL_FROM: ${{ secrets.HEAD_HASH_MAIL_FROM }}
          HEAD_HASH_MAIL_TO: ${{ secrets.HEAD_HASH_MAIL_TO }}
        run: uv run python mail_heads.py

  gaps:
    name: gaps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync --locked
      - name: Compare scheduled slots with the ledger; fail on any missing slot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAY: ${{ inputs.day }}
        run: uv run python gaps.py ${DAY:+"$DAY"}
