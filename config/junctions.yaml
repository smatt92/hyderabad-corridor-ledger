# Junction candidates: coordinates to verify on satellite imagery, not values to
# measure.
#
# Public sources give neighbourhood centroids, bus stops and metro stations, not
# junction centres, and a corridor's endpoints and via_points freeze the moment
# it is measured. So every point here is a candidate. verified stays false until
# Sahil confirms the junction centre on satellite imagery and records
# verified_on. A corridor may reference these ids, and cannot be verified, and
# therefore cannot leave draft, while a junction it uses is unverified.
#
# confidence: high | medium | low, as the research found it. Every low candidate
# says why in note, and even a high one still needs checking.
#
# Candidates within about 300 m of each other must name each other in
# distinct_from, so near neighbours are never conflated.
#
# NOT ESTABLISHED, deliberately not seeded: Khajaguda, NFCL Junction. Add them
# only with a sourced junction centre.
#
# AMBIGUOUS: "Kukatpally" may mean KPHB Circle (about 17.4938, 78.4018),
# Kukatpally Y-Junction, or Kukatpally metro station. Only the metro station is
# seeded, and it is not a decision: Sahil chooses which one a corridor means.
#
# Validated by collector/registry.py.

