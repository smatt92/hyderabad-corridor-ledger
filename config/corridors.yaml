# Corridor declarations: the only place a corridor is defined.
#
# Rules (validated by collector/config.py, geometry immutability by
# collector/immutability.py in CI):
# - id is permanent. Once a corridor has been anything but a draft, its origin,
#   destination, via_points and direction never change and it is never
#   removed. To change a measured road, retire it and declare a new id with
#   supersedes.
# - via_points: every corridor declares an ordered list of points on its road,
#   in the direction of travel. The collector sends them to TomTom as waypoints
#   on every call, so the corridor measures the same road for months instead of
#   whichever road TomTom picks that minute. Place each point on the intended
#   carriageway, away from junctions where the route could turn off.
# - class: core | alternate | donor. An alternate is declared, never derived:
#   it shares its pair's origin and destination and must differ from the core
#   in via_points, or both would measure the same road. A pair holding one
#   corridor is valid: no measured alternate. A donor is an unpaired control
#   corridor for intervention audits.
# - tier: A every 15 min, B and C every 30 min, 06:30-10:30 and 16:30-21:00
#   IST; every tier also every 30 min from 00:00 to 04:00 IST.
# - direction ab | ba. A pair's ba corridors reverse its ab endpoints.
# - status: draft (never collected) | active | paused | retired.
#
# The ten corridors below are PLACEHOLDERS, all status draft, so nothing here
# is collected. Their via_points show the shape only; they are not surveyed
# roads. Replace them with the real panel before activating anything.

