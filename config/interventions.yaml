# Treatment register: which roads have been rebuilt, are being rebuilt, or will
# be, and which areas are candidate controls.
#
# treatment_status: untreated | will_be_treated | under_construction | treated.
# A corridor in config/corridors.yaml that is not untreated cites one work here
# (treatment_work), with the same status, and that work must carry at least one
# source with a URL and a date. A donor corridor is always untreated: a road
# that is or will be rebuilt is never a control.
#
# events record each date with who gave it. Where official dates conflict, every
# one is recorded; none is chosen.
#
# Sources: the research of 14 Sep 2026 gave dates, costs and agencies but no
# URLs. Every work below therefore has sources: [] and cannot be cited by any
# corridor until a URL and a date are added. Nothing here was invented.
#
# RECHECK, every 92 days (collector/registry.py overdue, run weekly by
# .github/workflows/recheck.yml):
# - a control moves to under_construction, recorded as a work, on the first
#   traffic-diversion advisory or excavation report for its junction;
# - a will_be_treated work moves to under_construction on its first excavation
#   report.
#
# Validated by collector/registry.py.

version: 1
works:
  # --- TREATED or UNDER CONSTRUCTION: unusable as controls ---
  - id: bachupally-flyover
    name: Bachupally flyover, Miyapur X Roads to Gandimaisamma
    treatment_status: treated
    junctions: [miyapur-x-road, bachupally]
    events:
      - {event: opened, date: "2026-06-08", according_to: HMDA}
    cost: Rs 65.53 crore, per HMDA
    notes: >-
      Opened on 8 Jun 2026, before collection began, so this stretch has no
      usable baseline. This corrects the earlier plan.
    sources: []
    last_checked: 2026-09-14

  - id: film-nagar-kbr-park-cluster
    name: Film Nagar, Jubilee Hills Check Post, LV Prasad and KBR Park junctions
    treatment_status: under_construction
    junctions: [film-nagar, jubilee-hills-check-post]
    events:
      - {event: excavation_reported, date: "2026-09", note: excavation underway}
      - {event: target_completion, date: "2028-12"}
    sources: []
    last_checked: 2026-09-14

  - id: iiit-khajaguda-wipro-cluster
    name: IIIT, Khajaguda and Wipro junctions
    treatment_status: under_construction
    junctions: [wipro-junction]
    events:
      - {event: excavation_began, date: "2026-02"}
      - {event: target_completion, date: "2027-04", according_to: CMC Commissioner}
      - {event: target_completion, date: "2028-05", according_to: GHMC}
    notes: >-
      More than 30% of civil works reported done. The two official completion
      dates conflict and both are kept. Khajaguda has no established junction
      centre, so only Wipro Junction is linked.
    sources: []
    last_checked: 2026-09-14

  - id: lb-nagar-works
    name: LB Nagar junction works
    treatment_status: treated
    junctions: [lb-nagar]
    notes: >-
      Classified as already treated. Whether works are complete or still under
      way, and their dates, are not yet recorded.
    sources: []
    last_checked: 2026-09-14

  - id: uppal-works
    name: Uppal junction works
    treatment_status: treated
