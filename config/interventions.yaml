  # --- WILL BE TREATED: the only stretches where a pre-period is still
  # bankable. Priority baseline targets: seed these corridors first. ---
  - id: miyapur-allwyn-flyover
    name: Miyapur X Road to Allwyn X Road six-lane flyover
    treatment_status: will_be_treated
    junctions: [miyapur-x-road, allwyn-x-road]
    events: &package_events
      - {event: price_bids_opened, date: "2026-02-10"}
      - {event: target_completion, date: "2028", according_to: realistic estimate in the research}
    contract: &package >-
      One package with the two underpasses below: awarded to Shivasatya
      Engineering at Rs 384.45 crore, EPC with a 2-year defect liability period.
    notes: No excavation reported as of 14 Sep 2026. Priority baseline target.
    sources: []
    last_checked: 2026-09-14

  - id: hafeezpet-miyapur-underpass
    name: Hafeezpet to Miyapur underpass
    treatment_status: will_be_treated
    junctions: [hafeezpet, miyapur-x-road]
    events: *package_events
    contract: *package
    notes: No excavation reported as of 14 Sep 2026. Priority baseline target.
    sources: []
    last_checked: 2026-09-14

  - id: bachupally-allwyn-underpass
    name: Bachupally to Allwyn underpass
    treatment_status: will_be_treated
    junctions: [bachupally, allwyn-x-road]
    events: *package_events
    contract: *package
    notes: >-
      No excavation reported as of 14 Sep 2026. Priority baseline target. The
      Miyapur X Roads to Gandimaisamma stretch through Bachupally is already
      treated (bachupally-flyover), so a corridor here must avoid it or its
      baseline is contaminated.
    sources: []
    last_checked: 2026-09-14

