# Treatment register: which roads have been rebuilt, are being rebuilt, or will
# be, and which areas are candidate controls.
#
# treatment_status: untreated | will_be_treated | under_construction | treated.
# A corridor in config/corridors.yaml that is not untreated cites one work here
# (treatment_work), with the same status. The work must have a source with a
# URL, an access date and a reported stage that supports that status: proposed,
# planned, tendered or awarded for will_be_treated; under_construction; completed
# for treated. A donor corridor is always untreated: a road that is or will be
# rebuilt is never a control.
#
# events record each date with who gave it. Where dates conflict, every one is
# recorded and none is chosen.
#
# Sources were accessed on 13 Sep 2026 from Sahil's research report. A work with
# no URL keeps sources: [] and cannot be cited: an unrelated link is never
# borrowed. A source that names a work only at an earlier stage is recorded, and
# still leaves the work uncitable.
#
# RECHECK, every 92 days (collector/registry.py overdue, run weekly by
# .github/workflows/recheck.yml):
# - a control moves to under_construction, recorded as a work, on the first
#   traffic-diversion advisory or excavation report for its junction;
# - a will_be_treated work moves to under_construction on its first excavation
#   report.
#
# Validated by collector/registry.py.

version: 1

